<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartessa Real Estate Company</title>
<meta name="description" content="Cartessa Real Estate Company, Rochester Hills, Michigan. Adaptive reuse and affordable housing development led by Bill Chalmers. Website concept.">
<meta property="og:title" content="Cartessa Real Estate Company">
<meta property="og:description" content="We buy the buildings other people have written off, then deliver them on time, on budget and fully leased. Website concept for Cartessa and its properties.">
<meta property="og:image" content="img/ngop-after.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="img/c-mark.png">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Bill's completion package, online. A white page with his navy doing the structure
   (navigation bar, caption bars, short rules), photographs matted in white with a soft shadow the
   way his brochures mount them, overlapping collages, and same-angle before/after pairs. Garamond
   for headlines and running text, Franklin for navigation, labels and tables, Cinzel only for the
   wordmark. Westwood keeps its own rust and sans. One light theme, by choice, like print. */
:root{
  --navy:#00264B; --navy-2:#113E70; --navy-3:#1D558F;
  --sky:#E9EFF5; --sky-2:#D7E1EB;
  --paper:#FFFFFF; --ink:#1A2330; --ink-2:#434D5A; --mute:#6B7684; --rule:#CBD4DE;
  --rust:#774C3F; --rust-2:#5B382E; --sand:#F4EFE9; --sand-2:#E6DCD1;
  --brand:var(--navy); --brand-2:var(--navy-2); --panel:var(--sky); --panel-2:var(--sky-2);
  --wordmark:"Cinzel","Trajan Pro",Georgia,serif;
  --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--brand-2)}
p,figure,blockquote,ul,ol,dl,dd{margin:0}
ul,ol{padding:0}
li{list-style:none}
button{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.08;margin:0;color:var(--brand);text-wrap:balance}
h1{font-size:clamp(38px,5.6vw,64px);letter-spacing:-.005em}
h2{font-size:clamp(30px,4vw,42px)}
h3{font-size:26px}
h2.sec::after{content:"";display:block;width:56px;height:3px;background:var(--brand);margin-top:14px}
.sans{font-family:var(--sans)}
.lead{font-size:22px;line-height:1.45;color:var(--ink-2);max-width:58ch;text-wrap:pretty}
.prose{max-width:64ch;display:grid;gap:1em;text-wrap:pretty}
.prose p{font-size:19px}
.small{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink-2)}
.label{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.01em}
.muted{color:var(--mute)}
.btn{font-family:var(--sans);font-weight:600;font-size:14.5px;line-height:1;padding:13px 18px;background:var(--brand);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn.ghost:hover{background:var(--panel)}
.btn.white{background:#fff;color:var(--brand)}
.btn.white:hover{background:var(--panel)}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.arrow{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--brand);text-decoration:none;border-bottom:2px solid var(--brand);padding-bottom:2px}
.arrow:hover{color:var(--brand-2);border-color:var(--brand-2)}
.arrow::after{content:"\00a0\2192"}

/* masthead */
.mast{background:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 1px 0 var(--rule)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:14px}
.lockup{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--brand);min-width:0}
.lockup img{width:46px;height:auto;flex:none}
.lk-name{display:block;font-family:var(--wordmark);font-weight:600;font-size:24px;letter-spacing:.16em;line-height:1;color:var(--brand)}
.lk-sub{display:block;font-family:var(--serif);font-size:15px;line-height:1;margin-top:5px;color:var(--brand);letter-spacing:.01em}
.tagline{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-2);white-space:nowrap}
.tagline i{font-style:normal;color:var(--rule);padding:0 8px}
.menu-btn{display:none;font-family:var(--sans);font-weight:600;font-size:14px;background:var(--brand);color:#fff;border:0;padding:10px 14px;cursor:pointer}
.navbar{background:var(--brand)}
.navbar .wrap{display:flex;flex-wrap:wrap}
.navbar a{font-family:var(--sans);font-weight:500;font-size:14px;color:#fff;text-decoration:none;padding:15px 16px 13px;border-bottom:3px solid transparent;white-space:nowrap}
.navbar a:first-child{padding-left:0}
.navbar a:hover{border-bottom-color:rgba(255,255,255,.45)}
.navbar a.active{border-bottom-color:#fff;font-weight:600}
.navbar .right{margin-left:auto;padding-right:0;opacity:.9}
@media (max-width:900px){
  .tagline{display:none}
  .menu-btn{display:inline-block}
  .navbar{display:none}
  .navbar.open{display:block}
  .navbar .wrap{flex-direction:column;padding-block:6px 10px}
  .navbar a,.navbar a:first-child{padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.18)}
  .navbar a.active{border-bottom-color:rgba(255,255,255,.18)}
  .navbar .right{margin-left:0}
}
@media (max-width:420px){.lk-name{font-size:20px}.lockup img{width:40px}}

/* photo mats */
.mat{background:#fff;padding:6px;box-shadow:0 1px 2px rgba(0,20,40,.22),0 12px 28px rgba(0,38,75,.14);max-width:100%}
.mat img{width:100%;height:auto}
.mat.fill img{height:100%;object-fit:cover}
.mat.narrow{max-width:560px}
.capbar{display:block;background:var(--brand);color:#fff;font-family:var(--sans);font-size:12.5px;line-height:1.4;padding:8px 11px;margin-top:6px}
.capbar b{font-weight:700}
.cap{font-family:var(--sans);font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}

/* before / after */
.ba{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;--x:52%;background:var(--panel-2)}
.ba>img{width:100%;height:auto;display:block}
.ba .before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.ba .before img{width:100%;height:100%;object-fit:cover}
.ba .line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none}
.ba .knob{position:absolute;top:50%;left:var(--x);width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;pointer-events:none}
.ba .knob svg{width:22px;height:22px;color:var(--navy)}
.ba input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.ba .tag{position:absolute;bottom:12px;font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 9px;background:rgba(0,38,75,.88);color:#fff;pointer-events:none}
.ba .tag.l{left:12px}.ba .tag.r{right:12px}

/* layout blocks */
.section{padding-block:clamp(48px,7vw,80px)}
.section.tight{padding-block:clamp(32px,4vw,48px)}
.panel{background:var(--panel)}
.two{display:grid;grid-template-columns:5fr 7fr;gap:48px;align-items:center}
.two.even{grid-template-columns:1fr 1fr}
.two.text-right{grid-template-columns:7fr 5fr}
.two>*{min-width:0}
@media (max-width:860px){.two,.two.even,.two.text-right{grid-template-columns:1fr;gap:32px}}
.stack{display:grid;gap:18px;align-content:start}
.hero{padding-block:clamp(40px,6vw,72px) clamp(40px,6vw,64px)}
.hero h1{max-width:16ch}
.record{display:flex;flex-wrap:wrap;gap:10px 0;align-items:baseline;font-family:var(--sans);font-size:14px;color:var(--ink-2);border-top:2px solid var(--brand);border-bottom:1px solid var(--rule);padding:16px 0}
.record span{display:inline-flex;align-items:baseline;gap:8px}
.record span+span::before{content:"\25C6";color:var(--brand);font-size:8px;margin:0 16px;position:relative;top:-3px}
.record b{font-family:var(--serif);font-weight:600;font-size:26px;color:var(--brand);line-height:1}
@media (max-width:600px){.record{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}.record span+span::before{display:none}}

/* collage */
.collage{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);aspect-ratio:10/7;position:relative;max-width:100%}
.collage .mat{display:flex;flex-direction:column;position:relative}
.collage .mat img{flex:1;min-height:0;height:100%;object-fit:cover}
.collage .c1{grid-column:1/8;grid-row:1/9;z-index:1}
.collage .c2{grid-column:6/13;grid-row:3/12;z-index:2}
.collage .c3{grid-column:2/6;grid-row:8/13;z-index:3}
@media (max-width:700px){
  .collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto;aspect-ratio:auto;gap:14px}
  .collage .c1{grid-column:1/3;grid-row:auto}.collage .c2{grid-column:1/3;grid-row:auto}.collage .c3{grid-column:1/2;grid-row:auto}
  .collage .mat img{aspect-ratio:3/2;height:auto}
}

/* contents / index */
.toc{border-top:2px solid var(--brand)}
.toc a{display:grid;grid-template-columns:minmax(150px,1.1fr) 70px 2fr;gap:12px 20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.toc a:hover .n{color:var(--navy-3);text-decoration:underline;text-underline-offset:4px}
.toc .n{font-family:var(--serif);font-size:26px;color:var(--brand);line-height:1.1}
.toc .c{font-family:var(--sans);font-size:13px;color:var(--mute)}
.toc .x{font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.45}
@media (max-width:700px){.toc a{grid-template-columns:1fr 60px}.toc .x{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:4px 22px;font-family:var(--sans);font-size:14px;font-weight:500;padding:14px 0 18px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.filters a{color:var(--ink-2);text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
.filters a:hover{color:var(--brand)}
.filters a.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.ix-group{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:34px 0 10px;border-bottom:2px solid var(--brand)}
.ix-group h3{font-size:30px}
.ix-group .c{font-family:var(--sans);font-size:13px;color:var(--mute)}
.ix-head{display:grid;grid-template-columns:96px 1.5fr 1fr .9fr .8fr;gap:16px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--mute);padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.ix{display:grid;grid-template-columns:96px 1.5fr 1fr .9fr .8fr;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.ix img{width:96px;height:64px;object-fit:cover;outline:1px solid var(--rule);background:var(--panel)}
.ix .n{font-family:var(--serif);font-size:23px;color:var(--brand);line-height:1.1}
.ix:hover .n{text-decoration:underline;text-underline-offset:4px;color:var(--navy-3)}
.ix .m{font-family:var(--sans);font-size:14px;color:var(--ink-2)}
.ix .v{font-family:var(--sans);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .ix-head{display:none}
  .ix{grid-template-columns:84px 1fr;gap:4px 14px}
  .ix img{width:84px;height:56px;grid-row:1/4}
  .ix .m,.ix .v{font-size:13px}
}

/* project page */
.crumbs{font-family:var(--sans);font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;padding-top:26px}
.crumbs a{color:var(--mute);text-decoration:none}
.crumbs a:hover{color:var(--brand);text-decoration:underline}
.ptitle{padding-block:16px 30px;display:grid;gap:12px}
.ptitle .sub{font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.ptitle .sub b{color:var(--brand);font-weight:600}
.proj{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
@media (max-width:860px){.proj{grid-template-columns:1fr}}
.data{background:var(--panel);padding:22px 22px 24px;display:grid;gap:16px}
.data h3{font-size:16px;font-family:var(--sans);font-weight:700;color:var(--brand);border-bottom:2px solid var(--brand);padding-bottom:10px}
.data dl{display:grid;gap:12px}
.data dt{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--mute)}
.data dd{font-family:var(--serif);font-size:22px;color:var(--brand);line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.memo{margin-top:34px;max-width:64ch}
.memo dt{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--brand);margin-top:26px;display:flex;align-items:center;gap:10px}
.memo dt::after{content:"";flex:1;height:1px;background:var(--rule)}
.memo dd{font-size:20px;line-height:1.5;margin-top:8px;text-wrap:pretty}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.pn{display:flex;justify-content:space-between;gap:24px;margin-top:44px;padding-top:20px;border-top:2px solid var(--brand);font-family:var(--sans);font-size:14px}
.pn a{text-decoration:none;color:var(--ink-2);display:grid;gap:4px;min-width:0}
.pn a:hover b{text-decoration:underline;text-underline-offset:4px}
.pn b{font-family:var(--serif);font-size:22px;color:var(--brand);font-weight:500}
.pn .next{text-align:right}

/* quotes */
.quotes{columns:2;column-gap:56px}
.quotes blockquote{break-inside:avoid;margin:0 0 30px;display:grid;gap:10px}
.quotes p{font-size:21px;line-height:1.35;font-style:italic;text-wrap:pretty}
.quotes footer{font-family:var(--sans);font-size:13px;color:var(--mute);line-height:1.45}
.quotes footer b{color:var(--brand);font-weight:700;display:block}
@media (max-width:700px){.quotes{columns:1}}
.bigquote{font-size:clamp(26px,3.4vw,36px);line-height:1.25;font-style:italic;color:var(--brand);max-width:30ch;text-wrap:balance}

/* press */
.press{border-top:2px solid var(--brand)}
.press a{display:grid;gap:4px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.press .t{font-family:var(--serif);font-size:22px;color:var(--brand);line-height:1.2}
.press a:hover .t{text-decoration:underline;text-underline-offset:4px}
.press .o{font-family:var(--sans);font-size:13px;color:var(--mute)}

/* lists */
.civic{display:grid;gap:0}
.civic li{padding:11px 0;border-bottom:1px solid var(--rule);font-size:18px;line-height:1.35}
.civic li .sans{font-size:13px;color:var(--mute);display:block;margin-top:2px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.team>div{display:grid;gap:8px;border-top:2px solid var(--brand);padding-top:14px}
.team h3{font-size:24px}
.team .role{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2)}
.team p{font-size:17px;line-height:1.45}
@media (max-width:760px){.team{grid-template-columns:1fr}}
.orgs{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--sans);font-size:15px}
.orgs a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--rule)}
.orgs a:hover{border-bottom-color:var(--brand)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;font-family:var(--sans);font-size:16px}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--sand-2)}
.checks svg{width:18px;height:18px;flex:none;color:var(--brand);margin-top:3px}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);aspect-ratio:10/6.4;position:relative}
.gallery .mat{display:flex;flex-direction:column}
.gallery .mat img{flex:1;min-height:0;height:100%;object-fit:cover}
.gallery .g1{grid-column:1/7;grid-row:1/8;z-index:1}
.gallery .g2{grid-column:6/10;grid-row:2/7;z-index:2}
.gallery .g3{grid-column:9/13;grid-row:1/6;z-index:1}
.gallery .g4{grid-column:3/8;grid-row:7/13;z-index:3}
.gallery .g5{grid-column:8/13;grid-row:6/13;z-index:2}
@media (max-width:700px){
  .gallery{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto;aspect-ratio:auto;gap:12px}
  .gallery .mat{grid-column:auto;grid-row:auto}.gallery .g1{grid-column:1/3}
  .gallery .mat img{aspect-ratio:3/2;height:auto}
}
.units{display:flex;gap:40px;flex-wrap:wrap}
.units div{display:grid;gap:4px}
.units b{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1;color:var(--brand)}
.units span{font-family:var(--sans);font-size:14px;color:var(--ink-2)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.plan{border-top:2px solid var(--brand);padding-top:12px;display:grid;gap:8px}
.plan h3{font-family:var(--sans);font-weight:700;font-size:20px}
.plan li{font-family:var(--sans);font-size:15px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--sand-2)}
@media (max-width:600px){.plans{grid-template-columns:1fr}}

/* contact */
.kv{display:grid;gap:22px}
.kv>div{display:grid;gap:4px}
.kv .k{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--mute)}
.kv .v{font-family:var(--serif);font-size:26px;color:var(--brand);line-height:1.15;overflow-wrap:anywhere;text-decoration:none}
a.v:hover{text-decoration:underline;text-underline-offset:4px}
.copy{font-family:var(--sans);font-size:12px;font-weight:600;background:#fff;border:1px solid var(--rule);color:var(--ink-2);padding:6px 10px;cursor:pointer;justify-self:start;margin-top:4px}
.copy:hover{border-color:var(--brand);color:var(--brand)}
form.cf{display:grid;gap:14px;background:var(--panel);padding:24px}
.field{display:grid;gap:6px}
.field label{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{font-family:var(--sans);font-size:15px;padding:11px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);width:100%;min-width:0;border-radius:0}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.note{font-family:var(--sans);font-size:12.5px;color:var(--mute);line-height:1.5}
.sent{background:#fff;border-left:4px solid var(--brand);padding:18px 20px;display:grid;gap:6px}

/* footer */
.foot{background:var(--brand);color:#fff;padding-block:48px 24px;margin-top:56px}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:36px 40px}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr}}
.foot .lk-name,.foot .lk-sub{color:#fff}
.foot h4{font-family:var(--sans);font-size:12px;font-weight:700;margin:0 0 12px;color:rgba(255,255,255,.7)}
.foot ul{display:grid;gap:7px;font-family:var(--sans);font-size:14.5px}
.foot a{color:#fff;text-decoration:none}

/* ===== property sub-sites: shared parts ===== */
.ps{--brand:#2F5D46;--brand-2:color-mix(in srgb,var(--brand) 76%,#000);--panel:color-mix(in srgb,var(--brand) 6%,#fff);--panel-2:color-mix(in srgb,var(--brand) 14%,#fff);--line:color-mix(in srgb,var(--brand) 24%,#fff);--jost:"Jost","Century Gothic",Futura,sans-serif;--corm:"Cormorant Garamond","EB Garamond",Garamond,serif;--arch:"Archivo","Arial Narrow",Arial,sans-serif}
.ps h2{font-size:clamp(26px,3.2vw,36px)}
.ps .foot{background:var(--brand-2)}
.ps .ba .tag{background:color-mix(in srgb,var(--brand) 88%,transparent)}
.sx{padding-block:clamp(40px,6vw,68px)}
.sx.tint{background:var(--panel)}
.sx.rule{border-top:1px solid var(--line)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.cols2.wide-l{grid-template-columns:7fr 5fr}
.cols2.wide-r{grid-template-columns:5fr 7fr}

.cols2>*,.cols3>*{min-width:0}
@media (max-width:860px){.cols2,.cols2.wide-l,.cols2.wide-r,.cols3{grid-template-columns:1fr}}
.kicker{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--brand);margin-bottom:10px}
.mapfig{margin:0;border:1px solid var(--line);background:#fff;max-width:100%}
.mapfig img{width:100%;height:auto;display:block}
.mapfig figcaption{font:13px/1.45 var(--sans);color:var(--mute);padding:10px 12px;border-top:1px solid var(--line)}
.snap{margin:0;background:#fff;padding:7px 7px 0;box-shadow:0 1px 2px rgba(0,20,40,.2),0 10px 24px rgba(0,20,40,.13);max-width:340px;width:100%}
.snap img{width:100%;height:auto;display:block}
.snap figcaption{font:12px/1.4 var(--sans);color:var(--mute);padding:8px 2px 9px}
.snap.tilt{transform:rotate(-1.2deg)}
.kv{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:15px}
.kv th,.kv td{text-align:left;vertical-align:top;padding:11px 0;border-bottom:1px solid var(--line)}
.kv th{font-weight:600;color:var(--mute);font-size:13px;width:38%;padding-right:14px}
.kv td{color:var(--ink)}
.kv tr:first-child th,.kv tr:first-child td{border-top:2px solid var(--brand)}
.ledger{width:100%;border-collapse:collapse}
.ledger th{font:600 12px/1.3 var(--sans);color:var(--mute);text-align:left;padding:0 0 8px;border-bottom:2px solid var(--brand)}
.ledger td{vertical-align:top;padding:14px 18px 14px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4;width:50%}
.ledger td:first-child{color:var(--brand);font-weight:500}
@media (max-width:560px){.ledger thead{display:none}.ledger td{display:block;width:auto;padding:10px 0 4px;border:0}.ledger td+td{padding:0 0 14px;border-bottom:1px solid var(--line)}}
.facts-list{display:grid;gap:0}
.facts-list li{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.45}
.facts-list li b{font:600 13px/1.5 var(--sans);color:var(--brand);padding-top:3px}
@media (max-width:560px){.facts-list li{grid-template-columns:1fr}}
.plain-list li{padding:9px 0 9px 20px;border-bottom:1px solid var(--line);position:relative;font-size:17px;line-height:1.45}
.plain-list li::before{content:"";position:absolute;left:2px;top:19px;width:8px;height:2px;background:var(--brand)}
.near{display:grid;grid-template-columns:1fr auto;gap:0 18px;font-family:var(--sans);font-size:15px}
.near div{padding:9px 0;border-bottom:1px solid var(--line)}
.near div:nth-child(even){color:var(--mute);text-align:right;white-space:nowrap}
.near small{display:block;color:var(--mute);font-size:13px}
.today{display:flex;gap:12px;align-items:flex-start;font-family:var(--sans);font-size:15px;line-height:1.5;border:1px solid var(--line);padding:14px 16px;background:#fff}
.today i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:6px}
.today b{color:var(--brand)}
.srcs{font:12.5px/1.6 var(--sans);color:var(--mute)}
.srcs a{color:var(--mute);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;overflow-wrap:anywhere}
.srcs a:hover{color:var(--brand)}
.dg{width:100%;height:auto;display:block;font-family:var(--sans)}
.dg .t{font-size:13px;fill:var(--ink)}
.dg .tb{font-size:13px;font-weight:700;fill:var(--ink)}
.dg .ts{font-size:11.5px;fill:var(--mute)}
.dg .tw{font-size:13px;font-weight:700;fill:#fff}
.dg .tws{font-size:11.5px;fill:#fff;opacity:.85}
.dg .ta{font-size:12px;font-weight:700;fill:var(--brand)}
.dg .ln{stroke:var(--brand);fill:none;stroke-width:1.5}
.dg .lot{fill:var(--panel);stroke:var(--brand);stroke-width:1.5;stroke-dasharray:6 4}
.dg .old{fill:#fff;stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 3}
.dg .bld{fill:var(--brand)}
.dg .bld2{fill:var(--panel-2);stroke:var(--brand);stroke-width:1.2}
.dg .rd{fill:#E3E6EA}
.dgcap{font:13px/1.45 var(--sans);color:var(--mute);margin-top:10px}
.wasis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--brand);border-bottom:1px solid var(--line)}
.wasis div{padding:14px 18px 16px 0;position:relative;min-width:0}
.wasis div+div{padding-left:26px;border-left:1px solid var(--line)}
.wasis div+div::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;border-top:2px solid var(--brand);border-right:2px solid var(--brand);transform:translateY(-50%) rotate(45deg);background:var(--paper)}
.wasis span{display:block;font:600 12px/1.3 var(--sans);color:var(--mute);margin-bottom:5px}
.wasis b{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.2;color:var(--brand)}
@media (max-width:640px){.wasis{grid-template-columns:1fr}.wasis div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}.wasis div+div::before{display:none}}
.pressrow a{display:grid;gap:3px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.pressrow a:first-child{border-top:2px solid var(--brand)}
.pressrow .t{font-family:var(--serif);font-size:20px;line-height:1.25;color:var(--brand)}
.pressrow a:hover .t{text-decoration:underline;text-underline-offset:4px}
.pressrow .o{font:13px/1.4 var(--sans);color:var(--mute)}
.pressrow .s{font:14px/1.45 var(--sans);color:var(--ink-2)}
.pull{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3vw,32px);line-height:1.28;color:var(--brand);text-wrap:balance}
.pull-by{font:13px/1.45 var(--sans);color:var(--mute);margin-top:12px}
.pull-by b{color:var(--ink)}
.sibs{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--sans);font-size:14.5px}
.sibs a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--line)}
.sibs a:hover{border-bottom-color:var(--brand)}
.backbar{font:13px/1 var(--sans);background:var(--brand-2);color:#fff}
.backbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:9px}
.backbar a{color:#fff;text-decoration:none;opacity:.9}
.backbar a:hover{opacity:1;text-decoration:underline}
.snav{display:flex;flex-wrap:wrap;gap:2px 22px;font:500 14px/1 var(--sans)}
.snav a{color:inherit;text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
.snav a:hover{border-bottom-color:currentColor}

/* ===== bank branch file (engraved, centred) ===== */
.k-bank .bhead{text-align:center;padding-block:34px 0}
.k-bank .bhead .name{font-family:var(--wordmark);font-weight:600;font-size:clamp(24px,4.4vw,44px);letter-spacing:.12em;line-height:1.1;color:var(--brand);text-wrap:balance}
.k-bank .bhead .sub{font:500 14px/1.5 var(--sans);color:var(--ink-2);margin-top:12px;letter-spacing:.02em}
.k-bank .bhead .snav{justify-content:center;margin-top:22px;padding-block:6px;border-top:3px double var(--brand);border-bottom:1px solid var(--line);color:var(--brand)}
.k-bank .plaque-wrap{position:relative;margin-top:28px}
.k-bank .plaque{position:absolute;left:18px;bottom:54px;background:#fff;border:1px solid var(--brand);outline:3px solid #fff;padding:16px 18px;max-width:330px;font-family:var(--sans);font-size:14px;line-height:1.5;box-shadow:0 8px 22px rgba(0,0,0,.14)}

@media (max-width:760px){.k-bank .plaque{position:static;max-width:none;margin-top:12px;outline:0;box-shadow:none}.k-bank .plaque-wrap .snap{position:static;max-width:300px;margin-top:14px}}
.k-bank h2{font-family:var(--wordmark);font-weight:600;font-size:clamp(19px,2.2vw,23px);letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.k-bank h2::after{content:"";display:block;width:100%;height:0;border-top:3px double var(--line);margin-top:12px}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:0;counter-reset:pg;margin-top:22px}
.prog a{counter-increment:pg;text-decoration:none;color:var(--ink-2);text-align:center;padding:0 6px;position:relative;font:13px/1.35 var(--sans);min-width:0}
.prog a::before{content:counter(pg);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:0 auto 10px;border:1.5px solid var(--brand);color:var(--brand);background:#fff;font:600 17px/1 var(--serif);position:relative;z-index:1}
.prog a::after{content:"";position:absolute;left:-50%;right:50%;top:19px;border-top:1.5px solid var(--line)}
.prog a:first-child::after{display:none}
.prog a.on::before{background:var(--brand);color:#fff}
.prog a.on b{color:var(--brand)}
.prog a b{display:block;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.prog a:hover b{text-decoration:underline}
@media (max-width:700px){.prog{grid-template-columns:repeat(3,1fr);row-gap:20px}.prog a:nth-child(4)::after{display:none}}

/* ===== pharmacy land assembly (drawing title block) ===== */
.k-rx{--grid:color-mix(in srgb,var(--brand) 9%,#fff)}

.k-rx .tbnav{border-bottom:1px solid var(--line);color:var(--brand)}

.k-rx .sheet{background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--brand);padding:18px 18px 14px}
.k-rx .chips{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);font-family:var(--sans)}
.k-rx .chips div{flex:1 1 130px;padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.k-rx .chips b{display:block;font-family:var(--arch);font-weight:800;font-size:24px;color:var(--brand);line-height:1.1}
.k-rx .chips span{font-size:12.5px;color:var(--mute)}

/* ===== cafe corners (neighbourhood paper) ===== */
.k-cafe .paper{text-align:center;padding-block:26px 0}

        <p>The most recent work is Westwood, on the Pontiac/Bloomfield border in Oakland County: the 64-unit Westwood North, completed in December 2022, and the 120-unit Westwood South, newly constructed next door. A few years earlier, in the same neighborhood, Bill rebuilt a former college dormitory into The 819, a 26-unit apartment building that has been full since it opened.</p>
        <p>Before the apartments, Bill turned an 18,000-square-foot vacant single-tenant office building into 44 individual suites that were fully leased within three months of opening. He and his team also completed a 30,000-square-foot renovation and addition of a former chapel for a regional provider of elder care, and the redevelopment of North Greenfield Office Park, a 33,000-square-foot complex anchored by Henry Ford Health with its remaining buildings fully occupied by executive office users.</p>
        <p>Earlier still, Bill owned and developed 20 corners and outlots for national retailers including Walgreens, Starbucks and AmSouth Bank (now Regions), in Michigan and Florida. Fifteen of those sites were former gasoline service stations. Through the recession he provided third-party construction services for DA Contracting of Southfield.</p>
        <p>Bill is a graduate of the University of Michigan. He has sat on the planning and zoning side of the table as often as the development side, and was most recently appointed to the commission overseeing Pontiac&#x2019;s five-year development plan.</p>
      </div>
      <figure class="mat narrow">${img('bill-bio','Bill Chalmers')}<figcaption class="capbar"><b>Bill Chalmers</b>, founder and owner</figcaption></figure>
    </div>
  </div></section>

  <section class="section panel"><div class="wrap two" style="align-items:start">

    </div>
    <figure class="mat">${img('ross','Bill Chalmers presenting at the Ross School of Business')}<figcaption class="capbar">Presenting adaptive reuse to students at the Ross School of Business, April 2019</figcaption></figure>

  <section class="section"><div class="wrap">
    <h2 class="sec">A family business, run from Rochester Hills</h2>
    <div class="team" style="margin-top:30px">
      <div><h3>Bill Chalmers</h3><span class="role">Founder and owner</span><p>Acquisition, entitlement, construction and the landlord relationship, on every project since 2000.</p></div>
      <div><h3>Billy Chalmers</h3><span class="role">Leasing manager</span><p>Runs leasing and resident relations at Westwood and The 819. Residents mention him by name in nearly every review.</p></div>
      <div><h3>Carly</h3><span class="role">Operations and administration</span><p>With Cartessa since 2014, from administration to demolition and site cleanup. Supports the real estate teams day to day.</p></div>

function portfolio(catId){
  const active = CATS.some(c => c.id === catId) ? catId : 'all';
  const groups = active === 'all' ? CATS : [cat(active)];
  const c = cat(active);
  return `
  <section class="section" style="padding-top:36px"><div class="wrap">
    <div class="crumbs" style="padding-top:0"><a href="#home">Home</a><span>/</span><span>Development portfolio</span></div>
    <div class="ptitle"><h1>${c ? c.name : 'Development portfolio'}</h1><p class="lead">${c ? c.blurb : 'Twenty-six projects across Michigan and Florida, each written up the same way: the plan, the potential deal breakers, and the result.'}</p></div>
    <nav class="filters" aria-label="Filter by type"><a href="#portfolio" class="${active==='all'?'active':''}">All ${P.length}</a>${CATS.map(k => `<a href="#portfolio-${k.id}" class="${active===k.id?'active':''}">${k.name} ${byCat(k.id).length}</a>`).join('')}</nav>
    ${groups.map(g => `<div class="ix-group"><h3>${g.name}</h3><span class="c">${byCat(g.id).length} projects</span></div>
      <div class="ix-head"><span></span><span>Project</span><span>Location</span><span>Delivered</span><span>Value</span></div>
      ${byCat(g.id).map(indexRow).join('')}`).join('')}
  </div></section>`;
}

function notFound(){
  return `<section class="section"><div class="wrap stack"><h1>Not found</h1><p class="lead">That page isn&#x2019;t part of the concept yet.</p><a class="arrow" href="#home" style="justify-self:start">Back to the home page</a></div></section>`;

/* ---------- router ---------- */
function parse(){
  const h = (location.hash || '#home').slice(1).replace(/\/+$/,'');
  if(h.indexOf('property-') === 0){ const a = h.slice(9).split('~'); return {page:'property', slug:a[0], section:a[1] || ''}; }
  if(h.indexOf('portfolio') === 0) return {page:'portfolio', cat:h.slice(10) || 'all'};
  if(h.indexOf('westwood') === 0) return {page:'westwood', section:h.slice(9)};
  if(['home','about','press','contact'].indexOf(h) >= 0) return {page:h};
  return {page:'home'};
}

function render(){
  const r = parse();
  const app = $('#app');
  let body = '', kind = 'co', prop = null, site = null;
  switch(r.page){
    case 'about': body = about(); break;
    case 'portfolio': body = portfolio(r.cat); break;
    case 'property': prop = P.find(x => x.slug === r.slug) || null; if(prop && cfg(prop).kind){ site = buildSite(prop); body = site.body; kind = site.ww ? 'ww' : 'ps'; } else body = notFound(); break;
    case 'press': body = press(); break;
    case 'contact': body = contact(); break;
    case 'westwood': body = westwood(); kind = 'ww'; break;
    default: body = home();
  }
  app.className = kind === 'ww' ? 'ww' : (kind === 'ps' ? 'ps k-' + cfg(prop).kind : '');
  app.style.cssText = kind === 'ps' && cfg(prop).accent ? '--brand:' + cfg(prop).accent : '';
  app.innerHTML = (kind === 'ps' ? site.head : header(kind, r.page)) + `<main>${body}</main>` + (kind === 'ps' ? siteFooter(prop) : footer(kind));
  wire();
  if((r.page === 'westwood' || r.page === 'property') && r.section){
    const el = document.getElementById((r.page === 'westwood' ? 'ww-' : 'sec-') + r.section);
    if(el){ el.scrollIntoView({block:'start'}); return; }
  }
  window.scrollTo(0, 0);
}

function wire(){
  const btn = $('#menuBtn'), nav = $('#nav');
  if(btn && nav){
    btn.addEventListener('click', () => { const open = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', String(open)); btn.textContent = open ? 'Close' : 'Menu'; });
  }
  document.querySelectorAll('.ba').forEach(ba => {
    const r = ba.querySelector('input');
    const set = () => ba.style.setProperty('--x', r.value + '%');
    r.addEventListener('input', set); set();
  });
  document.querySelectorAll('.copy').forEach(b => b.addEventListener('click', () => {
    const txt = b.getAttribute('data-copy');
    const done = () => { const old = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = old; }, 1600); };
    const fallback = () => { const s = document.createElement('textarea'); s.value = txt; document.body.appendChild(s); s.select(); try { document.execCommand('copy'); done(); } catch(e){} document.body.removeChild(s); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
  }));
  const form = $('#cf');
  if(form){
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = (form.querySelector('#cf-name').value || '').trim();
      const email = (form.querySelector('#cf-email').value || '').trim();
      const msg = (form.querySelector('#cf-msg').value || '').trim();
      if(!name || !email || !msg){ form.querySelector('.note').textContent = 'Please add your name, email and a message before sending.'; return; }
      form.innerHTML = `<div class="sent"><span class="label">Received</span><p style="font-size:19px">Thanks, ${name.replace(/[<>&]/g,'')}. On the live site this lands in Bill&#x2019;s inbox and he replies from ${CO.email}. For now, email him directly.</p></div>`;
    });
  }
}

window.addEventListener('hashchange', render);
render();
})();
</script>
